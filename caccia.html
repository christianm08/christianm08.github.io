<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Caccia - Esame Venatorio | Preparati all'esame con domande reali</title>
    <meta name="description" content="Preparati all'esame venatorio con quiz gratuiti. Oltre 450 domande reali per l'esame di caccia in Campania.">
    <meta name="keywords" content="quiz caccia, esame venatorio, caccia campania, patente caccia, quiz esame">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Quiz Caccia - Esame Venatorio">
    <meta property="og:description" content="Preparati all'esame venatorio con quiz gratuiti. Oltre 450 domande reali.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="caccia/images/favicon.png">
    
    <!-- Preload CSS -->
    <link rel="preload" href="assets/css/liquid-glass.css" as="style">
    
    <!-- Stylesheets - Liquid Glass Design System -->
    <link rel="stylesheet" href="assets/css/liquid-glass.css">
    <link rel="stylesheet" href="caccia/styles.css">
</head>

<body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Vai al contenuto principale</a>
    
    <div class="container">
        <header role="banner">
            <h1>🎯 Quiz Caccia - Esame Venatorio</h1>
            <p style="color: var(--color-text-secondary);">Preparati all'esame con domande reali</p>
        </header>

        <nav class="nav-tabs" role="tablist" aria-label="Navigazione sezioni">
            <button class="nav-tab active" 
                    role="tab" 
                    aria-selected="true" 
                    aria-controls="quiz-tab" 
                    id="quiz-tab-btn"
                    onclick="switchTab('quiz')">Quiz</button>
            <button class="nav-tab" 
                    role="tab" 
                    aria-selected="false" 
                    aria-controls="database-tab" 
                    id="database-tab-btn"
                    onclick="switchTab('database')">Database Domande</button>
        </nav>

        <!-- Quiz Tab -->
        <div id="quiz-tab" class="tab-content active" role="tabpanel" aria-labelledby="quiz-tab-btn">
            <div class="counter-display">
                <div class="counter-item">
                    <span class="counter-value passed" id="passed-count">0</span>
                    <span class="counter-label">Quiz Passati</span>
                </div>
                <div class="counter-item">
                    <span class="counter-value failed" id="failed-count">0</span>
                    <span class="counter-label">Quiz Sbagliati</span>
                </div>
            </div>
            <div id="start-screen" class="start-screen">
                <h2>Inizia il Quiz</h2>
                <p>15 domande casuali - Massimo 2 errori consentiti</p>
                <button class="btn btn-primary" onclick="startQuiz()"
                    style="font-size: 1.2rem; padding: 20px 50px;">Inizia Quiz</button>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value">450</div>
                        <div class="stat-label">Domande Totali</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">15</div>
                        <div class="stat-label">Domande per Quiz</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">2</div>
                        <div class="stat-label">Errori Massimi</div>
                    </div>
                </div>
            </div>

            <div id="quiz-screen" class="hidden">

                <div style="display:flex; justify-content:flex-start; gap:12px; margin-bottom:12px;">
                    <button id="back-btn" class="btn btn-ghost" onclick="goBackToStart()">← Indietro</button>
                </div>

                <div id="questions-container"></div>

                <button id="confirm-btn" class="btn btn-primary btn-block" onclick="confirmAnswers()">
                    Conferma Risposte
                </button>

                <div id="result-container" class="hidden"></div>

                <button id="restart-btn" class="btn btn-success btn-block hidden" onclick="restartQuiz()">
                    Nuovo Quiz
                </button>
            </div>
        </div>

        <!-- Database Tab -->
        <div id="database-tab" class="tab-content" role="tabpanel" aria-labelledby="database-tab-btn">
            <div class="database-search">
                <input type="text" 
                       id="search-input" 
                       placeholder="🔍 Cerca domande..." 
                       oninput="filterQuestions()"
                       aria-label="Cerca nel database delle domande">
            </div>
            <div id="database-container"></div>
        </div>
    </div>

    <script src="caccia/script.js" defer></script>
</body>

</html>
