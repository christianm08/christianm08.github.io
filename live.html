<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLive - Canali Live Streaming</title>
    <meta name="description" content="Guarda i tuoi canali live preferiti in streaming. Sport, cinema, calcio e tanto altro.">
    <meta name="keywords" content="live, streaming, sport, cinema, calcio, tv">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="WorkLive - Canali Live Streaming">
    <meta property="og:description" content="Guarda i tuoi canali live preferiti in streaming.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="live/images/favicon.png">
    
    <!-- Preload CSS -->
    <link rel="preload" href="assets/css/liquid-glass.css" as="style">
    
    <!-- Stylesheets - Liquid Glass Design System -->
    <link rel="stylesheet" href="assets/css/liquid-glass.css">
    <link rel="stylesheet" href="live/live.css">
    
    <!-- Defer JavaScript -->
    <script src="live/live.js" defer></script>
</head>

<body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Vai al contenuto principale</a>
    
    <div class="app-container">
        <!-- Header -->
        <header class="header" role="banner">
            <div class="container">
                <div class="header-content">
                    <img src="live/images/logo.png" alt="WorkLive Logo" class="logo">
                    <div class="server-selector">
                        <label for="server-select" class="form-label">Server:</label>
                        <select id="server-select" class="form-control server-dropdown" aria-label="Seleziona server">
                            <option value="daddyhd.com/stream">Server 1</option>
                            <option value="daddyhd.com/cast">Server 2</option>
                            <option value="daddyhd.com/watch">Server 3</option>
                            <option value="daddyhd.com/plus">Server 4</option>
                            <option value="daddyhd.com/casting">Server 5</option>
                            <option value="daddyhd.com/player">Server 6</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" id="main-content" tabindex="-1">
            <div class="container">
                <div class="channels-section">
                    <h2>Canali Disponibili</h2>
                    <div class="channels-filter" role="group" aria-label="Filtra canali per categoria">
                        <button class="filter-btn active" data-category="all" aria-pressed="true">Tutti</button>
                        <button class="filter-btn" data-category="sport" aria-pressed="false">Sport</button>
                        <button class="filter-btn" data-category="cinema" aria-pressed="false">Cinema</button>
                        <button class="filter-btn" data-category="calcio" aria-pressed="false">Calcio</button>
                        <button class="filter-btn" data-category="tv" aria-pressed="false">TV</button>
                    </div>
                    <div class="channels-grid" id="channels-grid" role="list">
                        <!-- Channels will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Player Modal -->
        <div class="modal player-modal hidden" id="player-modal" role="dialog" aria-labelledby="channel-title" aria-modal="true">
            <div class="modal-backdrop" id="modal-backdrop"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="channel-title">Canale</h3>
                    <button class="modal-close" id="close-modal" aria-label="Chiudi modal">✕</button>
                </div>
                <div class="modal-body">
                    <div class="player-container">
                        <iframe id="player-frame" src="" frameborder="0" allowfullscreen title="Player video"></iframe>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay hidden" id="loading-overlay" aria-live="polite">
            <div class="loading-spinner"></div>
            <p>Caricamento stream...</p>
        </div>
    </div>

</body>

</html>
